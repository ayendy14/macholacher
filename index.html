<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוז חזרות למופע התרמה</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#ee294b">
<style>
:root{--bg:#fff;--fg:#2b2b2b;--mut:#777;--line:#d6d6d6;--acc:#ee294b;--hl:#f9bfc9;--dk:#4a4a4a;--cell:#ececec;--tdy:#fde3e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px;border:2px solid var(--acc);border-radius:6px}
h1{font-size:26px;margin:0 0 12px;color:var(--acc);font-weight:800}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:10px;cursor:pointer}
.btn.pri,.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.del{color:var(--acc);border-color:var(--acc)}
.sp{flex:1}
.wk{font-weight:700;min-width:150px;text-align:center}
.badge{font-size:12px;background:var(--dk);color:#fff;padding:4px 12px;border-radius:99px}
#lock{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:10;border:0;background:none;opacity:.07;cursor:pointer;font-size:18px}
#lock:hover{opacity:.5}
.scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
.scroll.aL{animation:inL .35s ease}.scroll.aR{animation:inR .35s ease}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:44px repeat(12,minmax(54px,1fr));min-width:720px;padding:4px}
.hd{padding:4px 2px;text-align:center;font-size:12px}
.hd.d{background:var(--acc);color:#fff;border-radius:10px;margin:0 2px 3px;padding:3px 2px;font-weight:700;font-size:14px;position:relative}
.hd.d b{display:block;line-height:1.2}
.hd.d.today{background:#b3122f;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc);z-index:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:30;display:none}.box p{margin:0 0 4px}
.hd.s{background:var(--dk);color:#fff;border-radius:8px;margin:0 2px 4px;font-size:11px;display:flex;align-items:center;justify-content:center}
.tc{position:relative}.tc span{position:absolute;inset-inline-end:5px;font-size:11px;color:var(--mut);transform:translateY(-7px)}
.col{position:relative;background:var(--cell);border-inline-start:1px solid var(--line)}
.col.df{border-inline-start:3px solid #fff}
.col.t{background:var(--tdy);box-shadow:inset 0 -4px 0 var(--acc)}
.col.ts{border-inline-start:3px solid var(--acc)}.col.te{border-inline-end:3px solid var(--acc)}
.sl{height:24px;border-bottom:1px dashed var(--line);cursor:pointer}
.sl:nth-child(2n){border-bottom:1px solid #c4c4c4}
.sl:hover,.sl:hover+.sl{background:var(--hl)}
.ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:2px 5px;font-size:12px;line-height:1.25;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px #0003}
.ev small{display:block;opacity:.9;direction:ltr;text-align:right}
.ev.cls{background-image:repeating-linear-gradient(135deg,#0000 0 6px,#ffffff30 6px 12px);cursor:default}
.perm .ev.cls{cursor:pointer}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:100%;overflow:auto}
.box h2{margin:0 0 10px;font-size:18px;color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafafa}
.row{display:flex;gap:8px}.row>*{flex:1}
.ck{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--fg);flex:2}.ck input{width:16px;height:16px}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw i.on{border-color:var(--fg)}
.acts{display:flex;gap:8px;margin-top:16px}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
.msg{background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--mut)}
.msg.ld{display:flex;align-items:center;gap:12px;justify-content:center;padding:40px}.msg.ld::before{content:'';width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.seg button.pm{flex:0 0 44px;color:var(--mut)}
.tp{display:flex;gap:6px;align-items:center;direction:ltr}.tp select{flex:1;text-align:center;direction:ltr}.tp b{font-size:18px}
.sum{text-align:center;font-weight:700;font-size:17px;margin-top:12px;direction:ltr}
.cd{display:inline-block;background:var(--tdy);color:var(--acc);border:1px solid var(--hl);border-radius:99px;padding:5px 14px;font-weight:700;margin:-4px 0 12px}
.cd small{font-weight:400;color:var(--mut);margin-inline-start:6px}
.err .btn{padding:3px 10px;margin-inline-start:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--mut);font-weight:600}
</style></head><body dir="rtl">
<button id="lock" aria-label="מנהל">🔒</button>
<main>
<h1>לוז חזרות למופע התרמה</h1>
<div class="cd" id="cd" style="display:none"></div>
<div class="bar" id="adm"></div>
<div class="bar" id="nav">
  <button class="btn" id="prev">→</button><span class="wk" id="wk"></span><button class="btn" id="next">←</button>
  <button class="btn" id="today">היום</button>
</div>
<div id="view"><div class="msg ld">טוען את הלוז…</div></div>
</main>
<div class="modal" id="m"><div class="box" id="box"></div></div><div class="toast" id="toast"></div>
<script>
const COLORS=['#ee294b','#e8924a','#d4a017','#4fa35f','#2f9b97','#4f86d9','#8a6ad6','#d76aa8','#8d5a3b','#6b7280','#1f3a8a','#14b8a6','#f472b6','#84cc16'],BLK='#111111';
const S0=480,S1=1380,H=24,DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי'],SN={A:'סטודיו גדול',B:'סטודיו קטן'};
const DURS=[30,45,60];                                   // משכי חזרה לבחירה (לכולם)
const DEFAULT_SHOW='2027-02-11';                         // מועד המופע כברירת מחדל (ניתן לשינוי במצב מנהל)
const $=s=>document.querySelector(s);
const sun=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d};
const start=()=>{const t=new Date();if(t.getDay()===6)t.setDate(t.getDate()+1);return sun(t)};
const todayNS=()=>{const t=new Date();t.setHours(0,0,0,0);if(t.getDay()===6)t.setDate(t.getDate()+1);return t};
const step=(d,n)=>{d=new Date(d);while(n!==0){d.setDate(d.getDate()+(n>0?1:-1));if(d.getDay()!==6)n-=Math.sign(n)}return d}; // n ימים קדימה/אחורה בלי שבת
const mob=()=>matchMedia('(max-width:640px)').matches;   // תצוגת מובייל: יומיים בכל פעם
const st={week:start(),day:todayNS(),pw:0,view:'s',bk:{},cl:{},lg:{},set:{},admin:false,db:null,anim:'',subH:false,loaded:false};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const wd=k=>new Date(k+'T00:00').getDay();
let myName='';try{myName=localStorage.getItem('nm')||''}catch(e){}

// ===== חיבור לשרת (Google Apps Script + Google Sheet) =====
const API_URL='https://script.google.com/macros/s/AKfycbw-J_vIJdnAr2uwx-7Q4DyxYW_tuhvixR8xCPwxjIKaDOYRmwd0R1xdPglWb9b4Tf83kA/exec'; // your Apps Script web app link (ends in /exec)
const GAS={call:(fn,args)=>fetch(API_URL,{method:'POST',body:JSON.stringify({fn,a:args})}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j.r})};
let ADMINPW='';
const RemoteDB=(()=>{
  const L={},D={bookings:{},classes:{},history:{},settings:{}};let busy=0;
  const snap=c=>{const docs=Object.entries(D[c]).map(([id,v])=>({id,exists:true,data:()=>v}));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}}};
  const fire=c=>(L[c]||[]).forEach(f=>f(snap(c)));
  const poll=async()=>{if(busy||document.hidden)return;try{const r=await GAS.call('getAll',[ADMINPW]);if(busy)return;st.loaded=true;Object.keys(r).forEach(c=>{D[c]=r[c];fire(c)})}catch(e){if(!st.loaded)$('#view').innerHTML='<div class="msg ld">החיבור לשרת נכשל, מנסים שוב…</div>'}};
  // רענון חסכוני: כל 20 שניות בזמן פעילות, כל דקה כשאין פעילות, ומיד כשחוזרים לטאב
  let last=Date.now();
  ['pointerdown','keydown','touchstart','scroll'].forEach(ev=>addEventListener(ev,()=>{last=Date.now()},{passive:true}));
  const tick=()=>{poll();setTimeout(tick,Date.now()-last>120000?60000:20000)};
  setTimeout(tick,20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){last=Date.now();poll()}});
  const w=async(c,id,d)=>{busy++;try{await GAS.call('write',[c,id,d,ADMINPW])}finally{busy--;poll()}};
  return{collection:c=>({
    get:async()=>snap(c),
    onSnapshot(f){(L[c]=L[c]||[]).push(f);poll();return()=>{}},
    doc:id=>({set:async d=>{D[c][id]=d;fire(c);await w(c,id,d)},delete:async()=>{delete D[c][id];fire(c);await w(c,id,null)}})
  })}
})();

(async()=>{
  st.db=RemoteDB;
  if(st.db){
    const sub=(c,t)=>st.db.collection(c).onSnapshot(s=>{st[t]={};s.docs.forEach(d=>st[t][d.id]=d.data());render()},()=>{});
    sub('bookings','bk');sub('classes','cl');sub('settings','set');
    [['bookings','bk'],['classes','cl'],['settings','set']].forEach(([c,t])=>st.db.collection(c).get().then(s=>{s.docs.forEach(d=>{if(!st[t][d.id])st[t][d.id]=d.data()});render()}).catch(()=>{}));
  }
  render();
})();

function render(){
  const m=mob(),f=d=>d.toLocaleDateString('he-IL',{day:'numeric',month:'short'});
  if(st.view==='p')$('#wk').textContent=m?DAYS[st.pw]+' – '+DAYS[st.pw+1]:'';
  else if(m)$('#wk').textContent=f(st.day)+' – '+f(step(st.day,1));
  else{const e=new Date(st.week);e.setDate(e.getDate()+5);$('#wk').textContent=f(st.week)+' – '+f(e)}
  const b=(v,t)=>`<button class="btn ${st.view===v?'on':''}" data-v="${v}">${t}</button>`;
  $('#adm').innerHTML=st.admin?`<span class="badge">מצב מנהל</span>${b('s','לוז חזרות')}${b('p','מערכת שעות קבועה')}${b('h','היסטוריה')}<button class="btn" id="cdb">מועד המופע</button><span class="sp"></span><button class="btn del" id="rs">איפוס הכול</button>`:'';
  $('#nav').style.display=st.view==='s'||(m&&st.view==='p')?'flex':'none';
  $('#today').style.display=st.view==='s'?'':'none';
  countdown();
  if(!st.loaded){$('#view').innerHTML='<div class="msg ld">טוען את הלוז…</div>';return}
  st.view==='h'?hist():grid(st.view==='p');
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
$('#adm').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v){st.view=b.dataset.v;render()}else if(b.id==='rs')resetAll();else if(b.id==='cdb')editShow()};

// ===== ספירה לאחור למופע =====
const HE={m:n=>n===1?'חודש':n===2?'חודשיים':n+' חודשים',w:n=>n===1?'שבוע':n===2?'שבועיים':n+' שבועות',d:n=>n===2?'יומיים':n+' ימים'};
const showDate=()=>{const s=st.set.show;return s===undefined?DEFAULT_SHOW:(s&&s.date)||null};
function countdown(){
  const el=$('#cd'),ds=showDate();if(!ds){el.style.display='none';return}
  const t=new Date();t.setHours(0,0,0,0);const d=new Date(ds+'T00:00'),days=Math.round((d-t)/864e5);let txt;
  if(days<0)txt='המופע כבר היה 🎉';
  else if(days===0)txt='המופע היום! 🎉';
  else if(days===1)txt='המופע מחר!';
  else if(days<=7)txt='עוד '+(days===7?'שבוע':HE.d(days))+' למופע';
  else{
    let m=0;for(;;){const x=new Date(t);x.setMonth(x.getMonth()+m+1);if(x>d)break;m++}
    const x=new Date(t);x.setMonth(x.getMonth()+m);const w=Math.floor(Math.round((d-x)/864e5)/7);
    txt='עוד '+(m>=2?HE.m(m):m===1?'חודש'+(w?(w>=3?' ו-':' ו')+HE.w(w):''):HE.w(w))+' למופע';
  }
  el.style.display='';el.innerHTML=`${esc(txt)} <small>${d.toLocaleDateString('he-IL',{day:'numeric',month:'long'})}</small>`;
}
function editShow(){
  const ds=showDate();
  $('#box').innerHTML=`<h2>מועד המופע</h2><label>תאריך</label><input type="date" id="sd" value="${ds||''}"><div class="err" id="er"></div><div class="acts"><button class="btn pri" id="sv">שמירה</button><button class="btn" id="cn">ביטול</button><span class="sp"></span>${ds?'<button class="btn del" id="rm">הסרת הספירה</button>':''}</div>`;
  $('#m').classList.add('on');$('#cn').onclick=close;
  const put=(date,act)=>{st.set.show={date};close();render();st.db.collection('settings').doc('show').set({date}).catch(fail);st.db.collection('history').doc(uid()).set({ts:Date.now(),action:act,by:'מנהל',text:date?'מועד המופע: '+date:'הספירה לאחור הוסרה'}).catch(()=>{})};
  $('#sv').onclick=()=>{const v=$('#sd').value;if(!v)return $('#er').textContent='נא לבחור תאריך.';put(v,'מועד המופע עודכן')};
  if(ds)$('#rm').onclick=()=>put(null,'מועד המופע הוסר');
}

function grid(perm){
  const m=mob(),n=(S1-S0)/30,tk=key(new Date());let days,wds;   // days = תאריכים להצגה, wds = אינדקס יום בשבוע
  if(perm){wds=m?[st.pw,st.pw+1]:[0,1,2,3,4,5];days=wds.map(i=>{const d=new Date(st.week);d.setDate(d.getDate()+i);return d})}
  else{days=m?[st.day,step(st.day,1)]:[...Array(6)].map((_,i)=>{const d=new Date(st.week);d.setDate(d.getDate()+i);return d});wds=days.map(d=>d.getDay())}
  let h=`<div class="grid" style="grid-template-columns:44px repeat(${days.length*2},minmax(54px,1fr));min-width:${m?0:720}px"><div class="hd" style="grid-row:span 2"></div>`;
  days.forEach((d,j)=>{const t=!perm&&key(d)===tk;h+=`<div class="hd d ${t?'today':''}" style="grid-column:span 2">${DAYS[wds[j]]}${perm?'':`<b>${d.getDate()}</b>`}</div>`});
  days.forEach(()=>h+=`<div class="hd s">${SN.A}</div><div class="hd s">${SN.B}</div>`);
  h+=`<div class="tc" style="height:${n*H}px">`+[...Array(n/2)].map((_,i)=>`<span style="top:${i*2*H}px">${tm(S0+i*60)}</span>`).join('')+'</div>';
  const slots=[...Array(n)].map((_,j)=>`<div class="sl" data-t="${S0+j*30}"></div>`).join('');
  days.forEach((d,j)=>['A','B'].forEach(s=>{
    const i=wds[j],k=key(d),t=!perm&&k===tk;
    h+=`<div class="col ${s==='A'?'df':''} ${t?'t '+(s==='A'?'ts':'te'):''}" data-d="${k}" data-w="${i}" data-s="${s}">${slots}`;
    Object.entries(st.cl).filter(([,c])=>c.studio===s&&c.wd===i).forEach(([id,c])=>h+=evt(id,c,'cls','c'));
    if(!perm)Object.entries(st.bk).filter(([,b])=>b.studio===s&&b.date===k).forEach(([id,b])=>h+=evt(id,b,b.locked?'cls':'','b'));
    h+='</div>';
  }));
  $('#view').innerHTML=`<div class="scroll ${perm?'perm':''} ${st.anim}">${h}</div></div>`;st.anim='';
}
function evt(id,e,cls,t){
  const ht=e.dur/30*H-2;
  return `<div class="ev ${cls}" data-id="${id}" data-t="${t}" style="top:${(e.start-S0)/30*H}px;height:${ht}px;background-color:${e.color}"><b>${cls?'🔒 ':''}${esc(e.title||e.name)}</b>${ht>30?`<small>${tm(e.start)}–${tm(e.start+e.dur)}</small>`:''}</div>`;
}
function hist(){
  const L=Object.values(st.lg).sort((a,b)=>b.ts-a.ts).slice(0,300);
  $('#view').innerHTML=L.length?'<div class="scroll"><table><tr><th>מתי</th><th>פעולה</th><th>מי</th><th>פרטים</th></tr>'+L.map(l=>`<tr><td>${new Date(l.ts).toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(l.action)}</td><td>${esc(l.by)}</td><td>${esc(l.text)}</td></tr>`).join('')+'</table></div>':'<div class="msg">אין שינויים עדיין.</div>';
}
const nav=(dir,a)=>{
  if(st.view==='p')st.pw=(st.pw+dir*2+6)%6;                                   // מערכת קבועה במובייל: זוגות ימים
  else if(mob()){st.day=step(st.day,dir*2);st.week=sun(st.day)}               // מובייל: יומיים קדימה/אחורה
  else{st.week.setDate(st.week.getDate()+dir*7);st.day=new Date(st.week)}     // מחשב: שבוע
  st.anim=a;render()};
$('#prev').onclick=()=>nav(-1,'aR');
$('#next').onclick=()=>nav(1,'aL');
$('#today').onclick=()=>{const w=start(),a=w<st.week?'aR':'aL';st.week=w;st.day=todayNS();st.anim=a;render()};
$('#view').onclick=e=>{
  if(!st.db||st.view==='h')return;
  const ev=e.target.closest('.ev'),col=e.target.closest('.col'),perm=st.view==='p';if(!col)return;
  if(ev){const id=ev.dataset.id;
    if(ev.dataset.t==='c'){if(perm)open({mode:'c',id,...st.cl[id]});return}
    if(st.bk[id]&&st.bk[id].locked&&!st.admin)return;open({mode:'b',id,...st.bk[id]});return}
  const sl=e.target.closest('.sl');if(!sl)return;
  // לחיצה בחצי העליון של המשבצת = xx:00 / xx:30, בחצי התחתון = xx:15 / xx:45
  let s=+sl.dataset.t+(e.clientY-sl.getBoundingClientRect().top>H/2?15:0);
  if(s+30>S1)s-=15;
  const dur=s+60<=S1?60:30;
  perm?open({mode:'c',start:s,dur,wd:+col.dataset.w,studio:col.dataset.s,color:BLK,title:'שיעור'}):open({mode:'b',date:col.dataset.d,start:s,dur,studio:col.dataset.s,color:st.admin?BLK:COLORS[5],name:myName});
};

// admin
function logout(){ADMINPW='';st.admin=false;st.view='s';render()}
$('#lock').onclick=()=>{
  if(st.admin)return logout();
  $('#box').innerHTML=`<h2>כניסת מנהל</h2><label>סיסמה</label><input type="password" id="pw" autocomplete="off"><div class="err" id="er"></div><div class="acts"><button class="btn pri" id="go">כניסה</button><button class="btn" id="cn">ביטול</button></div>`;
  $('#m').classList.add('on');$('#pw').focus();
  const go=async()=>{
    const p=$('#pw').value,ok=await GAS.call('check',[p]).catch(()=>false);
    if(!ok){$('#er').textContent='סיסמה שגויה';return}
    ADMINPW=p;st.admin=true;close();
    if(st.db&&!st.subH){st.subH=true;st.db.collection('history').onSnapshot(s=>{st.lg={};s.docs.forEach(d=>st.lg[d.id]=d.data());if(st.view==='h')render()},()=>{})}
    render();
  };
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#cn').onclick=close;
};
function resetAll(){
  $('#box').innerHTML=`<h2>איפוס הכול</h2><p>מה למחוק?</p><div class="acts" style="flex-direction:column"><button class="btn del" id="r1">את כל החזרות בלבד</button><button class="btn del" id="r2">את כל החזרות וגם את מערכת השעות הקבועה</button><button class="btn" id="n">ביטול</button></div>`;
  $('#m').classList.add('on');$('#n').onclick=close;
  const pick=async both=>{
    const what=both?'את כל החזרות וגם את כל השיעורים הקבועים':'את כל החזרות';
    if(!await ask('אישור אחרון','הפעולה סופית ולא ניתן לשחזר. למחוק '+what+'?','כן, למחוק'))return;
    Object.keys(st.bk).forEach(id=>st.db.collection('bookings').doc(id).delete().catch(fail));st.bk={};
    if(both){Object.keys(st.cl).forEach(id=>st.db.collection('classes').doc(id).delete().catch(fail));st.cl={}}
    render();
    st.db.collection('history').doc(uid()).set({ts:Date.now(),action:'איפוס',by:'מנהל',text:'נמחקו '+what}).catch(()=>{});
  };
  $('#r1').onclick=()=>pick(false);$('#r2').onclick=()=>pick(true);
}

// ===== טופס הזמנה / שיעור =====
let cur=null,color=null,pDur=60;                      // pDur = משך בדקות (למשתמש רגיל)
const MINS=[0,15,30,45];
const pStart=()=>+$('#hh').value*60+ +$('#hm').value;
const pEnd=()=>st.admin?+$('#eh').value*60+ +$('#em').value:pStart()+pDur;
const setT=(h,m,v)=>{v=Math.min(Math.max(v,S0),S1);$(h).value=Math.floor(v/60);$(m).value=v%60};
function open(o){
  cur=o;color=o.color||COLORS[5];pDur=o.dur||60;
  const cls=o.mode==='c',isNew=!o.id,adm=st.admin;
  const opts=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`).join('');
  const hrs=(a,b)=>{const r=[];for(let h=a;h<=b;h++)r.push([h,String(h).padStart(2,'0')]);return r};
  const mins=MINS.map(m=>[m,String(m).padStart(2,'0')]);
  const when=cls?`<div><label>יום</label><select id="dy">${opts(DAYS.map((d,i)=>[i,d]),o.wd)}</select></div>`:`<div><label>תאריך</label><input type="date" id="dt" value="${o.date||''}"></div>`;
  const end=o.start+(o.dur||60);
  const len=adm?`<label>שעת סיום</label><div class="tp"><select id="eh">${opts(hrs(S0/60,S1/60),Math.floor(end/60))}</select><b>:</b><select id="em">${opts(mins,end%60)}</select></div>`
               :`<label>משך</label><div class="seg" id="du"></div>`;
  $('#box').innerHTML=`<h2>${cls?(isNew?'שיעור קבוע חדש':'שיעור קבוע'):isNew?'הזמנת חזרה':'עריכת חזרה'}</h2>
  <label>${cls?'שם השיעור':'שם היוצרת'}</label><input id="nm" value="${esc(cls?o.title:o.name)}" maxlength="40">
  <div class="row"><div><label>סטודיו</label><select id="st">${opts([['A',SN.A],['B',SN.B]],o.studio)}</select></div>${when}</div>
  <label>שעת התחלה</label>
  <div class="tp"><select id="hh">${opts(hrs(S0/60,S1/60-1),Math.floor(o.start/60))}</select><b>:</b><select id="hm">${opts(mins,o.start%60)}</select></div>
  ${len}
  <div class="sum" id="sm"></div>
  ${adm&&!cls?`<label class="ck" style="margin-top:12px;font-size:18px" title="נעול" aria-label="נעול"><input type="checkbox" id="lk" ${o.locked?'checked':''}> 🔒</label>`:''}<label>צבע</label><div class="sw" id="sw"></div>
  <div class="err" id="er"></div>
  <div class="acts"><button class="btn pri" id="sv">שמירה</button><button class="btn" id="cn">ביטול</button><span class="sp"></span>${isNew?'':'<button class="btn del" id="rm">מחיקה</button>'}</div>`;
  paint();paintTime();$('#m').classList.add('on');
  dirty=false;$('#box').oninput=$('#box').onchange=()=>{dirty=true};
  // שינוי שעת ההתחלה (במצב מנהל) מזיז את שעת הסיום כך שהמשך נשמר
  let lastS=pStart();
  const onStart=()=>{const s=pStart();if(adm){setT('#eh','#em',pEnd()+(s-lastS))}lastS=s;paintTime()};
  $('#hh').onchange=onStart;$('#hm').onchange=onStart;
  if(adm){$('#eh').onchange=paintTime;$('#em').onchange=paintTime}
  else $('#du').onclick=e=>{const b=e.target.closest('button');if(b){pDur=+b.dataset.d;dirty=true;paintTime()}};
  $('#cn').onclick=close;$('#sv').onclick=save;if(!isNew)$('#rm').onclick=remove;
}
function paintTime(){
  const L={30:'30 דק׳',45:'45 דק׳',60:'שעה'};
  if(!st.admin)$('#du').innerHTML=DURS.map(d=>`<button type="button" data-d="${d}" class="${d===pDur?'on':''}">${L[d]}</button>`).join('');
  const s=pStart(),e=pEnd(),d=e-s,ex=st.admin?(d>0?` (${d} דק׳)`:''):'';
  $('#sm').textContent=tm(s)+' – '+tm(e)+ex;
  $('#sm').style.color=d>0?'':'#c0392b';
}
function paint(){$('#sw').innerHTML=(st.admin?[BLK,...COLORS]:COLORS).map(c=>`<i data-c="${c}" class="${c===color?'on':''}" style="background:${c}"></i>`).join('');$('#sw').onclick=e=>{if(e.target.dataset.c){color=e.target.dataset.c;dirty=true;paint()}}}
// לחיצה על הרקע סוגרת את הטופס – אלא אם יש שינויים שלא נשמרו, ואז מבקשים אישור
let dirty=false;
$('#m').onclick=e=>{
  if(e.target.id!=='m')return;
  if(dirty&&$('#nm')){$('#er').innerHTML='יש שינויים שלא נשמרו.<button class="btn del" id="lv">לסגור בלי לשמור</button>';$('#lv').onclick=close;return}
  close()};
function close(){$('#m').classList.remove('on');dirty=false}
const sum=x=>`${x.name||x.title} · ${SN[x.studio]} · ${x.date||'כל '+DAYS[x.wd]} ${tm(x.start)}–${tm(x.start+x.dur)}`;
const log=(a,x)=>{st.db.collection('history').doc(uid()).set({ts:Date.now(),action:a,by:myName||'לא ידוע',text:sum(x)}).catch(()=>{})};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
const fail=()=>toast('השמירה נכשלה, נסו שוב');
function ask(title,msg,ok){return new Promise(res=>{
  $('#box').innerHTML=`<h2>${title}</h2><p>${msg}</p><div class="acts"><button class="btn pri" id="y">${ok}</button><button class="btn" id="n">ביטול</button></div>`;
  $('#m').classList.add('on');
  $('#y').onclick=()=>{close();res(true)};$('#n').onclick=()=>{close();res(false)};
})}
const clash=(a,b)=>a.start<b.start+b.dur&&b.start<a.start+a.dur;
function save(){
  const cls=cur.mode==='c',adm=st.admin,er=m=>$('#er').textContent=m;
  const name=$('#nm').value.trim(),studio=$('#st').value,start=pStart(),dur=pEnd()-start,me={start,dur};
  if(!name)return er('נא להזין שם.');
  if(dur<=0)return er('שעת הסיום חייבת להיות אחרי ההתחלה.');
  if(start+dur>S1)return er('החזרה חורגת משעת הסגירה ('+tm(S1)+').');
  if(cls){
    const w=+$('#dy').value;
    for(const [id,c] of Object.entries(st.cl))if(c.studio===studio&&c.wd===w&&id!==cur.id&&clash(me,c))return er('מתנגש עם השיעור: '+c.title);
    const id=cur.id||uid(),x={studio,wd:w,start,dur,title:name,color};
    st.cl[id]=x;close();render();
    st.db.collection('classes').doc(id).set(x).catch(fail);log(cur.id?'שיעור נערך':'שיעור נוסף',x);return;
  }
  const date=$('#dt').value;if(!date)return er('נא לבחור תאריך.');
  if(!adm){const wk=key(sun(new Date(date+'T00:00')));for(const [id,b] of Object.entries(st.bk))if(id!==cur.id&&(b.name||'').trim().toLowerCase()===name.toLowerCase()&&key(sun(new Date(b.date+'T00:00')))===wk)return er('כבר יש חזרה של '+b.name+' בשבוע הזה. יש למחוק אותה לפני יצירת חזרה נוספת.')}
  const rep=1,items=[];
  for(let k=0;k<rep;k++){
    const d=new Date(date+'T00:00');d.setDate(d.getDate()+7*k);const dk=key(d),w=d.getDay(),at=rep>1?' בתאריך '+dk:'';
    if(w===6)return er('אין חזרות בשבת.');
    for(const c of Object.values(st.cl))if(c.studio===studio&&c.wd===w&&clash(me,c))return er('מתנגש עם השיעור: '+c.title+at);
    for(const [id,b] of Object.entries(st.bk))if(b.studio===studio&&b.date===dk&&id!==cur.id&&clash(me,b))return er('מתנגש עם '+b.name+' ('+tm(b.start)+'–'+tm(b.start+b.dur)+')'+at);
    items.push({id:k?uid():(cur.id||uid()),x:{studio,date:dk,start,dur,name,color,locked:!!($('#lk')&&$('#lk').checked)}});
  }
  myName=name;try{localStorage.setItem('nm',name)}catch(e){}
  const old=cur.id?st.bk[cur.id]:null;
  items.forEach(({id,x})=>{st.bk[id]=x;st.db.collection('bookings').doc(id).set(x).catch(fail)});
  close();render();
  log(old?'נערך':rep>1?'הוזמן ('+rep+' שבועות)':'הוזמן',items[0].x);
  if(old)st.db.collection('history').doc(uid()).set({ts:Date.now()-1,action:'↳ היה',by:name,text:sum(old)}).catch(()=>{});
}
async function remove(){
  if(!await ask('מחיקה','למחוק?','מחיקה'))return;
  const id=cur.id;
  if(cur.mode==='c'){const c=st.cl[id];delete st.cl[id];close();render();st.db.collection('classes').doc(id).delete().catch(fail);log('שיעור נמחק',c)}
  else{const b=st.bk[id];delete st.bk[id];close();render();st.db.collection('bookings').doc(id).delete().catch(fail);log('נמחק',b)}
}
</script></body></html>
